syntax = "proto3";

package bank.antifraud.v1;

import "bank/common/v1/money.proto";
import "bank/common/v1/pagination.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/zima-flow/go-mentor/mini-fintech/contracts/gen/bank/antifraud/v1;antifraudv1";

service AntifraudService {
  rpc CheckTransfer(CheckTransferRequest) returns (CheckTransferResponse);
  rpc ListRules(ListRulesRequest) returns (ListRulesResponse);
  rpc UpdateRule(UpdateRuleRequest) returns (UpdateRuleResponse);
}

enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  VERDICT_ALLOW = 1;
  VERDICT_DENY = 2;
}

message Rule {
  string rule_id = 1;
  string name = 2;
  string description = 3;
  bool enabled = 4;
  int64 threshold = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message CheckTransferRequest {
  string from_account_id = 1;
  string to_account_id = 2;
  bank.common.v1.Money amount = 3;
}

message CheckTransferResponse {
  Verdict verdict = 1;
  repeated string reasons = 2;
  repeated string triggered_rule_ids = 3;
}

message ListRulesRequest {
  bank.common.v1.PaginationRequest pagination = 1;
}

message ListRulesResponse {
  repeated Rule rules = 1;
  bank.common.v1.PaginationResponse pagination = 2;
}

message UpdateRuleRequest {
  string rule_id = 1;
  bool enabled = 2;
  int64 threshold = 3;
  string idempotency_key = 4;
}

message UpdateRuleResponse {
  Rule rule = 1;
}
