syntax = "proto3";

package bank.document.v1;

import "bank/common/v1/pagination.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/zima-flow/go-mentor/mini-fintech/contracts/gen/bank/document/v1;documentv1";

service DocumentService {
  rpc InitiateUpload(InitiateUploadRequest) returns (InitiateUploadResponse);
  rpc CompleteUpload(CompleteUploadRequest) returns (CompleteUploadResponse);
  rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse);
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);
  rpc HasRequiredDocuments(HasRequiredDocumentsRequest) returns (HasRequiredDocumentsResponse);
}

enum DocumentType {
  DOCUMENT_TYPE_UNSPECIFIED = 0;
  DOCUMENT_TYPE_PASSPORT = 1;
  DOCUMENT_TYPE_SELFIE = 2;
  DOCUMENT_TYPE_PROOF_OF_ADDRESS = 3;
}

enum DocumentStatus {
  DOCUMENT_STATUS_UNSPECIFIED = 0;
  DOCUMENT_STATUS_UPLOADED = 1;
  DOCUMENT_STATUS_CONFIRMED = 2;
}

message Document {
  string document_id = 1;
  string customer_id = 2;
  DocumentType type = 3;
  DocumentStatus status = 4;
  string file_name = 5;
  string content_type = 6;
  int64 size_bytes = 7;
  string sha256 = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp confirmed_at = 10;
}

message InitiateUploadRequest {
  string customer_id = 1;
  DocumentType type = 2;
  string file_name = 3;
  string content_type = 4;
  int64 size_bytes = 5;
  string idempotency_key = 6;
}

message InitiateUploadResponse {
  string document_id = 1;
  string upload_url = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message CompleteUploadRequest {
  string document_id = 1;
  string sha256 = 2;
  string idempotency_key = 3;
}

message CompleteUploadResponse {
  Document document = 1;
}

message GetDocumentRequest {
  string document_id = 1;
}

message GetDocumentResponse {
  Document document = 1;
}

message ListDocumentsRequest {
  string customer_id = 1;
  DocumentType type = 2;
  bank.common.v1.PaginationRequest pagination = 3;
}

message ListDocumentsResponse {
  repeated Document documents = 1;
  bank.common.v1.PaginationResponse pagination = 2;
}

message HasRequiredDocumentsRequest {
  string customer_id = 1;
  repeated DocumentType required_types = 2;
}

message HasRequiredDocumentsResponse {
  bool has_all = 1;
  repeated DocumentType missing_types = 2;
}
